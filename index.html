<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calorie Deficit/Surplus Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1 class="title">Calorie Deficit / Surplus Calculator<br>
      <span class="subtitle">Weight Management Tool</span>
    </h1>
    <form id="calorieForm">
      <!-- Goal Type Buttons -->
      <label>Select Your Goal:</label>
      <div class="goal-buttons">
        <button type="button" class="goal-btn" data-goal="loss">Weight Loss</button>
        <button type="button" class="goal-btn" data-goal="gain">Weight Gain</button>
      </div>
      <input type="hidden" id="goalType" required>

      <label for="age">Age:</label>
      <input type="number" id="age" required>

      <label for="gender">Gender:</label>
      <select id="gender" class="placeholder" required>
        <option value="" disabled selected>Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>

      <label for="weight">Weight (kg):</label>
      <input type="number" id="weight" required>

      <div class="input-group">
        <div>
          <label for="feet">Height (Feet):</label>
          <input type="number" id="feet" min="0" required>
        </div>
        <div>
          <label for="inches">Height (Inches):</label>
          <input type="number" id="inches" min="0" max="11" required>
        </div>
      </div>

      <label for="activity">Activity Level:</label>
      <select id="activity" class="placeholder" required>
        <option value="" disabled selected>Select your activity level</option>
        <option value="1.2">Sedentary (little or no exercise)</option>
        <option value="1.375">Lightly active (light exercise/sports 1-3 days/week)</option>
        <option value="1.55">Moderately active (moderate exercise/sports 3-5 days/week)</option>
        <option value="1.725">Very active (hard exercise/sports 6-7 days/week)</option>
        <option value="1.9">Extra active (very hard exercise/sports & physical job)</option>
      </select>

      <label for="goal">Weight Goal (kg/month):</label>
      <input type="number" id="goal" required>

      <label for="language">Select Language for Report:</label>
      <select id="language" class="placeholder">
        <option value="" disabled selected>
          Select Language | زبان منتخب کریں | Sélectionnez la langue | भाषा चुनें | Seleccione el idioma | اختر اللغة
        </option>
        <option value="english">English</option>
        <option value="urdu">اردو</option>
        <option value="french">Français</option>
        <option value="punjabi">ਪੰਜਾਬੀ</option>
        <option value="spanish">Español</option>
        <option value="arabic">العربية</option>
      </select>

      <button type="submit" id="calculateButton" disabled>Calculate</button>
    </form>

    <div id="result" class="result">
      <p><strong>Your Maintenance Calories:<br></strong> <span id="maintenanceCalories">-</span> Calories/day</p>
      <p><br><strong>Calorie Intake for Goal:<br></strong> <span id="calorieIntake">-</span> Calories/day</p>
      <p><br><strong>Daily <span id="deficitOrSurplus">-</span>:<br></strong> <span id="dailyDeficit">-</span> Calories/day</p>

      <h3 id="reportHeading">Descriptive Report:</h3>
      <ul id="report"></ul>

      <p class="signature">By,<br><strong>Dr. Ayesha Omar</strong></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
